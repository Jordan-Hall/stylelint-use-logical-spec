name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly run against stylelint@latest and @next catches upstream breakage early.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run package

  matrix:
    # Supported Node.js majors (from the Node.js release schedule) and stylelint
    # versions (from peerDependencies), so neither list is maintained by hand.
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.matrix.outputs.node }}
      stylelint: ${{ steps.matrix.outputs.stylelint }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: matrix
        run: node scripts/ci-matrix.mjs | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (node ${{ matrix.node }}, stylelint ${{ matrix.stylelint }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.matrix.outputs.node) }}
        stylelint: ${{ fromJSON(needs.matrix.outputs.stylelint) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save stylelint@${{ matrix.stylelint }}
      - run: npm test

  # The one required status check: passes only when lint and every test job pass.
  ci-ok:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')

  canary:
    name: canary (stylelint ${{ matrix.tag }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, next]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - id: tag
        # stylelint only publishes a `next` tag during pre-release cycles
        run: |
          if version=$(npm view "stylelint@${{ matrix.tag }}" version 2>/dev/null) && [ -n "$version" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::stylelint has no ${{ matrix.tag }} tag; skipping"
          fi
      - if: steps.tag.outputs.version
        run: npm ci
      - if: steps.tag.outputs.version
        run: npm install --no-save stylelint@${{ steps.tag.outputs.version }}
      - if: steps.tag.outputs.version
        run: npm test
